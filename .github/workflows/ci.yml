# Checks that need neither the game nor RitsuLib. Build, Tier 1, Tier 2, headed review, and the
# catalog freshness checks need the installed game and stay on the maintainer's machine.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Tests and payload (Windows)
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      PYTHONUTF8: "1"
      # The payload must not pick up __pycache__ from the test run.
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: python -m pip install --disable-pip-version-check pillow

      - name: Unit tests
        run: python -m unittest discover -s games/sts2/tools/tests -p 'test_*.py'

      - name: Whitespace (git diff --check)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          if [ -n "$BASE" ] && git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            git diff --check "$BASE" HEAD
          else
            git show --check --format= HEAD
          fi

      - name: Payload matches its sources
        run: |
          bash ./publish.sh --force
          changes="$(git status --porcelain --untracked-files=all -- skills)"
          if [ -n "$changes" ]; then
            echo "skills/ differs from what publish.sh generates from games/ and scripts/publish/:"
            echo "$changes"
            echo "Run publish.sh --force locally and commit the result."
            exit 1
          fi
